<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cute Recipes | Receptsamling</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <script type="module" src="./src/home.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>Cute Recipes</h1>
    <p>En enkel privat receptsamling.</p>
  </header>

  <main class="container">
    <section>
      <h2>Alla recept</h2>

      <div class="recipe-controls">
        <div class="recipe-filters" aria-label="Filtrera recept efter kategori" data-filter-buttons></div>

        <input
          class="recipe-search"
          type="search"
          data-recipe-search
          placeholder="Sök recept..."
          aria-label="Sök recept"
        />
      </div>

      <ul class="recipe-list" data-recipe-list></ul>

      <p class="filter-empty" data-filter-empty hidden>Inga recept matchar ditt val just nu.</p>
    </section>
  </main>
</body>
</html>
